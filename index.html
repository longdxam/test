<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ Sơ Cá Nhân</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .profile-card {
            background-color: #ffffff;
            width: 350px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .profile-card:hover {
            transform: translateY(-5px);
        }

        .header-bg {
            height: 120px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            margin-top: -50px;
            background-color: #e2e8f0;
            object-fit: cover;
        }

        .content {
            padding: 20px;
        }

        .name {
            font-size: 24px;
            color: #1f2937;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .title {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .bio {
            color: #4b5563;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            padding: 10px 25px;
            background-color: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 600;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #5a67d8;
        }
    </style>
</head>

<body>

    <div class="profile-card">
        <div class="header-bg"></div>
        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="Avatar" class="profile-img">
        <div class="content">
            <div class="name">Lập Trình Viên</div>
            <div class="title">Backend Developer</div>
            <div class="bio">Đam mê khám phá công nghệ mới, đặc biệt là tối ưu hóa cơ sở dữ liệu và xây dựng hệ thống
                máy chủ hiệu năng cao.</div>
            <a href="#" class="btn">Theo dõi</a>
        </div>
    </div>

</body>

</html>
